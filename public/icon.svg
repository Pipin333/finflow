<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#012456" />
      <stop offset="100%" stop-color="#061d47" />
    </linearGradient>
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#psBg)" />
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#1d4ed8" stroke-width="16" opacity="0.9" />

  <!-- ATM Card Frame -->
  <rect x="72" y="112" width="368" height="288" rx="44" fill="#0a2d6c" stroke="#00d4ff" stroke-width="22" />

  <!-- Card Stripe -->
  <rect x="72" y="180" width="368" height="48" fill="#012456" />

  <!-- Security Chip -->
  <rect x="120" y="264" width="84" height="70" rx="14" fill="url(#chipGold)" />
  <line x1="162" y1="264" x2="162" y2="334" stroke="#061d47" stroke-width="5" />
  <line x1="120" y1="299" x2="204" y2="299" stroke="#061d47" stroke-width="5" />

  <!-- Terminal Prompt (>_) -->
  <path d="M246 270 L286 299 L246 328" fill="none" stroke="#00d4ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="310" y1="328" x2="360" y2="328" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
</svg>
